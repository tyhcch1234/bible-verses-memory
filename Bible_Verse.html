:root{

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

}

  padding:9px 14px; border-radius:999px; cursor:pointer; font-size:14px;

}
.tab:hover{border-color:var(--accent); color:var(--accent)}
.tab.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.panel{display:none}
.panel.active{display:block}
table{width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 6px 20px rgba(90,70,40,.08)}
thead th{background:#efe6d3; color:#6b5738; text-align:left; padding:12px 16px; font-size:14px; letter-spacing:2px}
tbody td{border-top:1px solid var(--line); padding:14px 16px; vertical-align:top}
tbody tr:hover{background:#fbf6ea}
.q{width:78%}
.btn-cell{width:22%; text-align:right; vertical-align:middle}
.qline{font-size:15.5px}
.qnum{display:inline-block; background:var(--accent-soft); color:var(--accent); font-weight:700; border-radius:6px; padding:1px 7px; margin-right:6px; font-size:13px}
.ref{color:var(--accent); font-weight:700}
.btn{
  border:1px solid var(--accent); background:#fff; color:var(--accent);
  padding:9px 16px; border-radius:10px; cursor:pointer; font-size:14.5px;
  font-family:inherit; white-space:nowrap; transition:.15s;
}
.btn:hover{background:var(--accent); color:#fff}
.btn.recording{background:var(--rec); border-color:var(--rec); color:#fff; animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,69,69,.45)}70%{box-shadow:0 0 0 12px rgba(214,69,69,0)}100%{box-shadow:0 0 0 0 rgba(214,69,69,0)}}
.result{margin-top:11px; padding:12px 14px; background:#fbf7ee; border:1px solid var(--line); border-radius:10px; font-size:14.5px}
.result .listening{color:var(--rec); font-weight:600; margin-bottom:6px}
.score-badge{display:inline-block; font-weight:700; font-size:15px; padding:4px 12px; border-radius:999px; margin-bottom:8px}
.score-badge.good{background:#e6f4e6; color:var(--good); border:1px solid #bfe0bf}
.score-badge.mid{background:#fdf0dc; color:var(--mid); border:1px solid #f0d2a0}
.score-badge.low{background:#fdecea; color:var(--low); border:1px solid #f0b9b9}
.result .said{color:#6b5738; margin-bottom:6px; word-break:break-word}
.result .ans{color:var(--ink)}
.result .ans b{color:var(--accent)}
.result .err{color:var(--low)}
footer{text-align:center; color:var(--muted); font-size:12.5px; padding:10px 16px 30px}
@media(max-width:560px){ .wrap{padding:12px 8px 40px} .q,.btn-cell{padding:10px} .qline{font-size:14px} .btn{padding:8px 10px; font-size:13px} }
</style>

[1,"創世記2:24 人要離開父母與妻子連合，二人成為什麼？","因此，人要離開父母，與妻子連合，二人成為一體。"],
[1,"出埃及記20:3 神吩咐除了祂以外不可有什麼？","除了我以外，你不可有別的神。"],

[1,"申命記6:5 當用什麼樣的心愛耶和華你的神？","你要盡心、盡性、盡力愛耶和華你的神。"],

[1,"約書亞記1:8 這律法書不可離開口，總要怎樣？如此道路就如何？","這律法書不可離開你的口，總要晝夜思想，好使你謹守遵行這書上所寫的一切話。如此，你的道路就可以亨通，凡事順利。"],
[1,"約書亞記1:9 神吩咐約書亞當剛強壯膽，為什麼？","我豈沒有吩咐你嗎？你當剛強壯膽！不要懼怕，也不要驚惶；因為你無論往哪裡去，耶和華你的神必與你同在。"],
[1,"約書亞記24:15 約書亞說他和他的家必定怎樣？","至於我和我家，我們必定事奉耶和華。"],

[1,"列王紀上8:23 所羅門稱頌神，說神向什麼樣的人守約施慈愛？","耶和華以色列的神啊，天上地下沒有神可比你的！你向那盡心行在你面前的僕人守約施慈愛。"],
[1,"詩篇23:1 耶和華是我的牧者，我必如何？","耶和華是我的牧者，我必不致缺乏。"],
[1,"詩篇23:4 行過死蔭幽谷為何不怕遭害？","我雖然行過死蔭幽谷，也不怕遭害，因為你與我同在；你的杖，你的竿，都安慰我。"],
[1,"詩篇27:1 耶和華是我的亮光和拯救，我還怕誰呢？","耶和華是我的亮光，是我的拯救，我還怕誰呢？耶和華是我性命的保障，我還懼誰呢？"],
[1,"詩篇34:18 耶和華靠近什麼樣的人？","耶和華靠近傷心的人，拯救靈性痛悔的人。"],
[1,"詩篇37:4 要以耶和華為樂，祂就怎樣？","又要以耶和華為樂，他就將你心裡所求的賜給你。"],
[1,"詩篇46:1 神是我們的什麼？","神是我們的避難所，是我們的力量，是我們在患難中隨時的幫助。"],
[1,"詩篇51:10 大衛求神為他造什麼心？","神啊，求你為我造清潔的心，使我裡面重新有正直的靈。"],
[1,"詩篇55:22 要把重擔卸給誰？祂必如何？","你要把你的重擔卸給耶和華，他必撫養你；他永不叫義人動搖。"],
[1,"詩篇90:12 求神指教我們怎樣數算日子，好得著什麼？","求你指教我們怎樣數算自己的日子，好叫我們得著智慧的心。"],
[1,"詩篇91:1-2 住在至高者隱密處的必住在哪裡？耶和華是什麼？","住在至高者隱密處的，必住在全能者的蔭下。我要論到耶和華說：他是我的避難所，是我的山寨，是我的神，是我所倚靠的。"],
[1,"詩篇100:4-5 當怎樣進入神的門和院？耶和華本為善，祂的慈愛如何？","當稱謝進入他的門，當讚美進入他的院；當感謝他，稱頌他的名。因為耶和華本為善，他的慈愛存到永遠，他的信實直到萬代。"],
[1,"詩篇119:11 將神的話藏在心裡有什麼作用？","我將你的話藏在心裡，免得我得罪你。"],

[1,"詩篇139:14 詩人為何稱謝神？","我要稱謝你，因我受造，奇妙可畏；你的作為奇妙，這是我心深知道的。"],
[1,"箴言3:5-6 要專心仰賴耶和華，不可怎樣？在一切事上認定祂，祂必如何？","你要專心仰賴耶和華，不可倚靠自己的聰明，在你一切所行的事上都要認定他，他必指引你的路。"],
[1,"箴言4:23 要保守什麼勝過保守一切？為什麼？","你要保守你心，勝過保守一切，因為一生的果效是由心發出。"],

[1,"箴言12:25 人心憂慮時如何？一句良言有何作用？","人心憂慮，屈而不伸；一句良言，使心歡樂。"],
[1,"箴言16:9 人心籌算道路，惟誰指引腳步？","人心籌算自己的道路；惟耶和華指引他的腳步。"],
[1,"箴言18:10 耶和華的名是什麼？義人奔入便如何？","耶和華的名是堅固臺；義人奔入便得安穩。"],
[1,"箴言30:8-9 求神使虛假謊言遠離，並求什麼？為什麼？","求你使虛假和謊言遠離我；使我也不貧窮也不富足，賜給我需用的飲食；恐怕我飽足不認你，說：耶和華是誰呢？又恐怕我貧窮就偷竊，以致褻瀆我神的名。"],
[1,"傳道書3:1 凡事都有什麼？天下萬務都有什麼？","凡事都有定期，天下萬務都有定時。"],
[1,"以賽亞書26:3 堅心倚賴神的，神必如何保守他？","堅心倚賴你的，你必保守他十分平安，因為他倚靠你。"],
[1,"以賽亞書40:29 疲乏的和軟弱的，神如何待他們？","疲乏的，他賜能力；軟弱的，他加力量。"],
[1,"以賽亞書40:31 等候耶和華的必如何？","但那等候耶和華的必從新得力。他們必如鷹展翅上騰；他們奔跑卻不困倦，行走卻不疲乏。"],
[1,"以賽亞書41:10 神吩咐不要害怕驚惶，因為祂必怎樣？","你不要害怕，因為我與你同在；不要驚惶，因為我是你的神。我必堅固你，我必幫助你；我必用我公義的右手扶持你。"],
[1,"以賽亞書53:5 因祂受的刑罰和鞭傷，我們得什麼？","哪知他為我們的過犯受害，為我們的罪孽壓傷。因他受的刑罰，我們得平安；因他受的鞭傷，我們得醫治。"],
[1,"以賽亞書55:11 神口所出的話必如何？","我口所出的話也必如此，決不徒然返回，卻要成就我所喜悅的，在我發它去成就的事上必然亨通。"],
[1,"耶利米書29:11 耶和華向祂的子民所懷的意念是怎樣的？","耶和華說：我知道我向你們所懷的意念是賜平安的意念，不是降災禍的意念，要叫你們末後有指望。"],
[1,"耶利米哀歌3:22-23 我們不致消滅是出於什麼？每早晨如何？","我們不致消滅，是出於耶和華諸般的慈愛；是因他的憐憫不致斷絕。每早晨這都是新的；你的誠實極其廣大！"],
[1,"彌迦書6:8 耶和華向人所要的是什麼？","世人哪，耶和華已指示你何為善。他向你所要的是什麼呢？只要你行公義，好憐憫，存謙卑的心，與你的神同行。"],
[1,"彌迦書7:18 神有何特質？祂不永遠懷怒，喜愛什麼？","神啊，有何神像你，赦免罪孽，饒恕你產業之餘民的罪過，不永遠懷怒，喜愛施恩？"],
[1,"哈巴谷書3:17-18 即使無花果不發旺、牛羊絕跡，先知仍要如何？","雖然無花果樹不發旺，葡萄樹不結果，橄欖樹也不效力，田地不出糧食，圈中絕了羊，棚內也沒有牛；然而，我要因耶和華歡欣，因救我的神喜樂。"],
[1,"民數記6:24-26 大祭司的祝福包括哪些？","願耶和華賜福給你，保護你。願耶和華使他的臉光照你，賜恩給你。願耶和華向你仰臉，賜你平安。"],
[1,"民數記23:19 神與人有何不同？祂說話豈不怎樣？","神非人，必不致說謊，也非人子，必不致後悔。他說話豈不照著行呢？他發言豈不要成就呢？"],
[1,"約伯記42:5 約伯從前風聞什麼，現在怎樣？","我從前風聞有你，現在親眼看見你。"],
[2,"約翰福音1:1 太初有什麼？道與神關係如何？","太初有道，道與神同在，道就是神。"],
[2,"約翰福音1:14 道成了什麼？住在哪裡？充充滿滿有什麼？","道成了肉身，住在我們中間，充充滿滿地有恩典有真理。我們也見過他的榮光，正是父獨生子的榮光。"],
[2,"約翰福音3:16 神愛世人到什麼程度？信祂的人得什麼？","神愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不至滅亡，反得永生。"],

[2,"約翰福音11:25 耶穌說復活和生命在誰？信祂的人雖然死了也必怎樣？","復活在我，生命也在我。信我的人雖然死了，也必復活。"],
[2,"約翰福音14:6 耶穌說祂是什麼？若不藉著祂沒有人能怎樣？","我就是道路、真理、生命；若不藉著我，沒有人能到父那裡去。"],
[2,"馬太福音1:21 耶穌這名字的意義是什麼？","她將要生一個兒子，你要給他起名叫耶穌，因他要將自己的百姓從罪惡裡救出來。"],

[2,"希伯來書12:2 我們當仰望誰？祂因前面的喜樂就怎樣？","仰望為我們信心創始成終的耶穌。他因那擺在前面的喜樂，就輕看羞辱，忍受了十字架的苦難，便坐在神寶座的右邊。"],

[2,"羅馬書3:23 世人犯了罪，虧缺了什麼？","因為世人都犯了罪，虧缺了神的榮耀。"],
[2,"羅馬書5:8 基督在我們還作罪人的時候為我們死，顯明了什麼？","惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。"],
[2,"羅馬書6:23 罪的工價是什麼？神的恩賜是什麼？","因為罪的工價乃是死；惟有神的恩賜，在我們的主基督耶穌裡，乃是永生。"],
[2,"羅馬書10:9 口裡認什麼、心裡信什麼就必得救？","你若口裡認耶穌為主，心裡信神叫他從死裡復活，就必得救。"],
[2,"以弗所書2:8-9 得救是本乎什麼、因著什麼？不是出於什麼？","你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的；也不是出於行為，免得有人自誇。"],
[2,"以弗所書2:10 我們原是神的什麼？在基督裡造成為要叫我們什麼？","我們原是他的工作，在基督耶穌裡造成的，為要叫我們行善，就是神所預備叫我們行的。"],
[2,"哥林多後書5:17 若有人在基督裡，他就是什麼？舊事如何？","若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。"],
[2,"哥林多後書5:21 神使那無罪的替我們成為什麼？好叫我們在祂裡面成為什麼？","神使那無罪的，替我們成為罪，好叫我們在他裡面成為神的義。"],
[2,"加拉太書2:20 保羅說他已經與基督同釘十字架，現在活著的是誰？","我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著。"],
[2,"提多書3:5 神救了我們，不是因什麼？乃是照什麼？","他便救了我們，並不是因我們自己所行的義，乃是照他的憐憫，藉著重生的洗和聖靈的更新。"],
[2,"約翰一書1:9 我們若認自己的罪，神必如何？","我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。"],
[2,"約翰一書5:13 約翰寫這些話給信神兒子之名的人，要叫他們知道什麼？","我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生。"],
[2,"使徒行傳4:12 除耶穌以外，天下人間有沒有別的名可以靠著得救？","除他以外，別無拯救；因為在天下人間，沒有賜下別的名，我們可以靠著得救。"],
[2,"彼得前書1:3 神照自己的大憐憫，藉耶穌復活重生了我們，叫我們有什麼？","願頌讚歸與我們主耶穌基督的父神！他曾照自己的大憐憫，藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望。"],
[2,"約翰福音14:16-17 耶穌求父另賜什麼？這保惠師要與門徒怎樣？","我要求父，父就另外賜給你們一位保惠師，叫他永遠與你們同在，就是真理的聖靈。"],
[2,"約翰福音14:27 耶穌留下什麼給門徒？祂所賜的與世人有何不同？","我留下平安給你們；我將我的平安賜給你們。我所賜的，不像世人所賜的。你們心裡不要憂愁，也不要膽怯。"],
[2,"約翰福音16:33 耶穌說這些事是要門徒在祂裡面有什麼？在世上有苦難但可以怎樣？","我將這些事告訴你們，是要叫你們在我裡面有平安。在世上，你們有苦難；但你們可以放心，我已經勝了世界。"],
[2,"使徒行傳1:8 聖靈降臨在門徒身上，他們就必得著什麼？並要在哪裡作見證？","但聖靈降臨在你們身上，你們就必得著能力，並要在耶路撒冷、猶太全地，和撒瑪利亞，直到地極，作我的見證。"],
[2,"羅馬書8:28 萬事互相效力，叫什麼樣的人得益處？","我們曉得萬事都互相效力，叫愛神的人得益處，就是按他旨意被召的人。"],
[2,"羅馬書8:31 神若幫助我們，誰能怎樣？","神若幫助我們，誰能敵擋我們呢？"],
[2,"羅馬書8:38-39 保羅深信無論何事都不能叫我們與什麼隔絕？","因為我深信無論是死，是生，是天使，是掌權的，是有能的，是現在的事，是將來的事，是高處的，是低處的，是別的受造之物，都不能叫我們與神的愛隔絕；這愛是在我們的主基督耶穌裡的。"],
[2,"羅馬書12:1 保羅勸弟兄將身體獻上當作什麼？這樣事奉是否理所當然？","所以弟兄們，我以神的慈悲勸你們，將身體獻上，當作活祭，是聖潔的，是神所喜悅的；你們如此事奉乃是理所當然的。"],
[2,"羅馬書12:2 不要效法什麼？只要心意如何？好察驗什麼？","不要效法這個世界，只要心意更新而變化，叫你們察驗何為神的善良、純全、可喜悅的旨意。"],
[2,"哥林多前書6:19 信徒的身子是什麼？聖靈從哪裡來？","豈不知你們的身子就是聖靈的殿嗎？這聖靈是從神而來，住在你們裡頭的。"],
[2,"哥林多前書10:13 神是信實的，在受試探時必怎樣？","你們所遇見的試探，無非是人所能受的。神是信實的，必不叫你們受試探過於所能受的；在受試探的時候，總要給你們開一條出路，叫你們能忍受得住。"],
[2,"哥林多前書16:13 保羅吩咐信徒務要怎樣？","你們務要警醒，在真道上站立得穩，要做大丈夫，要剛強。"],
[2,"加拉太書5:22-23 聖靈所結的果子有哪些？","聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。這樣的事沒有律法禁止。"],
[2,"以弗所書4:28 從前偷竊的應當怎樣？總要勞力做什麼？","從前偷竊的，不要再偷；總要勞力，親手做正經事，就可有餘分給那缺少的人。"],
[2,"以弗所書4:29 污穢的言語當如何？只要說什麼樣的話？","污穢的言語一句不可出口，只要隨事說造就人的好話，叫聽見的人得益處。"],
[2,"腓立比書2:3 凡事不可結黨、貪圖虛浮榮耀，只要存什麼心？","凡事不可結黨，不可貪圖虛浮的榮耀；只要存心謙卑，各人看別人比自己強。"],
[2,"腓立比書4:6-7 應當一無掛慮，只要怎樣？神所賜的平安必如何？","應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。"],
[2,"腓立比書4:8 信徒應當思念哪些事？","弟兄們，我還有未盡的話：凡是真實的、可敬的、公義的、清潔的、可愛的、有美名的，若有什麼德行，若有什麼稱讚，這些事你們都要思念。"],
[2,"腓立比書4:13 保羅說他靠著誰，凡事都能做？","我靠著那加給我力量的，凡事都能做。"],
[2,"歌羅西書3:23 無論做什麼，都當怎樣做？","無論做什麼，都要從心裡做，像是給主做的，不是給人做的。"],
[2,"帖撒羅尼迦前書5:16-18 神在基督耶穌裡向信徒所定的旨意是什麼？","要常常喜樂，不住地禱告，凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。"],
[2,"提摩太後書1:7 神賜給我們的不是什麼心，乃是什麼心？","因為神賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心。"],
[2,"提摩太後書3:16-17 聖經都是神所默示的，於哪些方面有益？","聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的，叫屬神的人得以完全，預備行各樣的善事。"],
[2,"希伯來書4:12 神的道是怎樣的？比什麼更快？","神的道是活潑的，是有功效的，比一切兩刃的劍更快，甚至魂與靈，骨節與骨髓，都能刺入、剖開，連心中的思念和主意都能辨明。"],
[2,"希伯來書11:1 信是什麼？","信就是所望之事的實底，是未見之事的確據。"],
[2,"雅各書1:2-4 落在百般試煉中當以為什麼？信心經過試驗生什麼？","我的弟兄們，你們落在百般試煉中，都要以為大喜樂；因為知道你們的信心經過試驗，就生忍耐。但忍耐也當成功，使你們成全、完備，毫無缺欠。"],
[2,"雅各書1:19 信徒各人要怎樣聽、怎樣說、怎樣動怒？","我親愛的弟兄們，這是你們所知道的。但你們各人要快快地聽，慢慢地說，慢慢地動怒。"],
[2,"雅各書1:22 信徒要怎樣，不要單單聽道？","只是你們要行道，不要單單聽道，自己欺哄自己。"],
[2,"彼得前書5:7 要將一切的憂慮卸給誰？為什麼？","你們要將一切的憂慮卸給神，因為他顧念你們。"],
[2,"彼得前書5:8 務要謹守警醒，因為仇敵魔鬼如何？","務要謹守，警醒。因為你們的仇敵魔鬼，如同吼叫的獅子，遍地遊行，尋找可吞吃的人。"],
[3,"約翰福音13:34 耶穌賜給門徒什麼新命令？","我賜給你們一條新命令，乃是叫你們彼此相愛；我怎樣愛你們，你們也要怎樣相愛。"],
[3,"約翰福音13:35 眾人因什麼認出我們是耶穌的門徒？","你們若有彼此相愛的心，眾人因此就認出你們是我的門徒了。"],
[3,"約翰福音15:13 人的愛心沒有比什麼更大的？","人為朋友捨命，人的愛心沒有比這個大的。"],
[3,"羅馬書13:8 凡事不可虧欠人，惟有彼此相愛要常以為什麼？","凡事都不可虧欠人，惟有彼此相愛要常以為虧欠，因為愛人的就完全了律法。"],
[3,"哥林多前書13:4-7 愛有哪些表現？","愛是恆久忍耐，又有恩慈；愛是不嫉妒；愛是不自誇，不張狂，不做害羞的事，不求自己的益處，不輕易發怒，不計算人的惡，不喜歡不義，只喜歡真理；凡事包容，凡事相信，凡事盼望，凡事忍耐。"],
[3,"哥林多前書13:13 如今常存的有哪三樣？其中最大的是什麼？","如今常存的有信，有望，有愛這三樣，其中最大的是愛。"],
[3,"彼得前書4:8 最要緊的是什麼？因為愛能怎樣？","最要緊的是彼此切實相愛，因為愛能遮掩許多的罪。"],
[3,"約翰一書4:16 神是什麼？住在愛裡面的就住在哪裡？","神就是愛，住在愛裡面的，就是住在神裡面，神也住在他裡面。"],
[3,"約翰一書4:19 我們愛，因為什麼？","我們愛，因為神先愛我們。"],
[3,"以弗所書1:22-23 神使基督為教會作什麼？教會是什麼？","又將萬有服在他的腳下，使他為教會作萬有之首。教會是他的身體，是那充滿萬有者所充滿的。"],
[3,"以弗所書4:2-3 信徒當用什麼態度竭力保守聖靈所賜合而為一的心？","凡事謙虛、溫柔、忍耐，用愛心互相寬容，用和平彼此聯絡，竭力保守聖靈所賜合而為一的心。"],
[3,"彼得前書2:9 信徒是被揀選的族類、君尊的祭司、聖潔的國度、屬神的子民，要叫你們做什麼？","惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬神的子民，要叫你們宣揚那召你們出黑暗入奇妙光明者的美德。"],
[3,"馬太福音22:37-39 誡命中的第一且最大的是什麼？其次呢？","你要盡心、盡性、盡意愛主你的神。這是誡命中的第一，且是最大的。其次也相倣，就是要愛人如己。"],
[3,"馬太福音7:7 祈求、尋找、叩門的結果各如何？","你們祈求，就給你們；尋找，就尋見；叩門，就給你們開門。"],
[3,"路加福音6:31 你們願意人怎樣待你們，你們也要怎樣？","你們願意人怎樣待你們，你們也要怎樣待人。"],
[3,"使徒行傳2:42 初代教會恆心遵守什麼？","都恆心遵守使徒的教訓，彼此交接，擘餅，祈禱。"],
[3,"哥林多前書12:27 你們就是什麼？並且各自作什麼？","你們就是基督的身子，並且各自作肢體。"],
[3,"以弗所書4:15-16 信徒當用愛心做什麼？全身靠基督怎樣？","惟用愛心說誠實話，凡事長進，連於元首基督，全身都靠他聯絡得合式，百節各按各職，照著各體的功用彼此相助，便叫身體漸漸增長，在愛中建立自己。"],
[3,"腓立比書1:5 保羅從頭一天直到如今，為腓立比人什麼事感謝？","因為從頭一天直到如今，你們是同心合意地興旺福音。"],
[3,"歌羅西書3:13 若有嫌隙當怎樣？主怎樣饒恕我們，我們也要怎樣？","倘若這人與那人有嫌隙，總要彼此包容，彼此饒恕；主怎樣饒恕了你們，你們也要怎樣饒恕人。"],
[3,"哥林多後書1:4 神在一切患難中安慰我們，叫我們能做什麼？","我們在一切患難中，他就安慰我們，叫我們能用神所賜的安慰去安慰那遭各樣患難的人。"],
[3,"哥林多後書4:17 至暫至輕的苦楚要為我們成就什麼？","我們這至暫至輕的苦楚，要為我們成就極重無比、永遠的榮耀。"],
[3,"哥林多後書12:9 主說祂的恩典如何？祂的能力在哪裡顯得完全？","我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。所以我更喜歡誇自己的軟弱，好叫基督的能力覆庇我。"],
[3,"羅馬書5:3-5 患難生什麼？忍耐生什麼？老練生什麼？","不但如此，就是在患難中也是歡歡喜喜的；因為知道患難生忍耐，忍耐生老練，老練生盼望；盼望不至於羞恥，因為所賜給我們的聖靈將神的愛澆灌在我們心裡。"],
[3,"羅馬書8:18 現在的苦楚若比起什麼就不足介意？","我想，現在的苦楚若比起將來要顯於我們的榮耀就不足介意了。"],
[3,"彼得前書5:10 暫受苦難之後，賜諸般恩典的神必如何？","那賜諸般恩典的神曾在基督裡召你們，得享他永遠的榮耀，等你們暫受苦難之後，必要親自成全你們，堅固你們，賜力量給你們。"],
[3,"帖撒羅尼迦前書4:13 論到睡了的人，保羅不願意弟兄們不知道，恐怕他們怎樣？","論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣。"],
[3,"希伯來書4:16 我們當怎樣來到施恩的寶座前？為要得什麼？","所以，我們只管坦然無懼地來到施恩的寶座前，為要得憐恤，蒙恩惠，作隨時的幫助。"],
[3,"詩篇30:5 神的怒氣和恩典各如何？一宿哭泣後早晨怎樣？","因為，他的怒氣不過是轉眼之間；他的恩典乃是一生之久。一宿雖然有哭泣，早晨便必歡呼。"],
[3,"以賽亞書43:2 從水中經過、從火中行過會如何？","你從水中經過，我必與你同在；你逿過江河，水必不漫過你；你從火中行過，必不被燒，火焰也不著在你身上。"],
[3,"馬太福音24:35 天地要廢去，什麼不能廢去？","天地要廢去，我的話卻不能廢去。"],
[3,"馬太福音24:42 為什麼門徒要警醒？","所以，你們要警醒，因為不知道你們的主是哪一天來到。"],
[3,"使徒行傳17:31 神已經定了日子，要藉著誰按公義審判天下？","因為他已經定了日子，要藉著他所設立的人按公義審判天下，並且叫他從死裡復活，給萬人作可信的憑據。"],
[3,"帖撒羅尼迦前書4:16-17 主降臨時，在基督裡死了的人先怎樣？活著存留的人後來如何？","因為主必親自從天降臨，有呼叫的聲音和天使長的聲音，又有神的號吹響；那在基督裡死了的人必先復活。以後我們這活著還存留的人必和他們一同被提到雲裡，在空中與主相遇。這樣，我們就要和主永遠同在。"],

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let currentBtn = null;
let finalTranscript = '';
let errorOccurred = false;
let stopTimer = null;

function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function cleanText(s){ return String(s||'').replace(/[^\u4e00-\u9fff]/g,''); }

function bigrams(s){ const set=new Set(); for(let i=0;i<s.length-1;i++){ set.add(s.slice(i,i+2)); } return set; }

function similarity(a,b){
  const ca=cleanText(a), cb=cleanText(b);
  if(!ca.length || !cb.length) return 0;
  const A=bigrams(ca), B=bigrams(cb);
  if(A.size===0 || B.size===0) return ca===cb?1:0;
  let inter=0; A.forEach(g=>{ if(B.has(g)) inter++; });
  return (2*inter)/(A.size+B.size);
}
function scoreOf(a,b){ return Math.round(similarity(a,b)*100); }

function buildPanels(){
  const panelsEl=document.getElementById('panels');
  const rowsByCat={1:[],2:[],3:[],4:[]};
  DATA.forEach((d,i)=>{
    const cat=d[0], qnum=i+1, q=d[1];
    const m=q.match(/^(\S+)\s+(.*)$/);
    const ref=m?m[1]:'';
    const qtext=m?m[2]:q;
    rowsByCat[cat].push(
      '<tr data-q="'+qnum+'">'+
      '<td class="q"><div class="qline"><span class="qnum">Q'+qnum+'</span> <span class="ref">'+escapeHtml(ref)+'</span> <span>'+escapeHtml(qtext)+'</span></div>'+
      '<div class="result" style="display:none"></div></td>'+
      '<td class="btn-cell"><button class="btn">背金句</button></td>'+
      '</tr>'
    );
  });
  for(let c=1;c<=4;c++){
    const panel=document.createElement('div');
    panel.className='panel'+(c===1?' active':'');
    panel.id='panel-'+c;
    panel.innerHTML='<table><thead><tr><th class="q">題目</th><th class="btn-cell">練習</th></tr></thead>'+
      '<tbody>'+rowsByCat[c].join('')+'</tbody></table>';
    panelsEl.appendChild(panel);
  }
  document.querySelectorAll('.panel tbody tr').forEach(tr=>{
    const btn=tr.querySelector('.btn');
    const res=tr.querySelector('.result');
    const qnum=parseInt(tr.getAttribute('data-q'),10);
    btn.addEventListener('click',()=>toggle(btn,DATA[qnum-1],res));
  });
}

function bindTabs(){
  document.getElementById('tabs').addEventListener('click',e=>{
    const b=e.target.closest('.tab'); if(!b) return;
    if(recognition) recognition.stop();
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+b.getAttribute('data-tab')).classList.add('active');
  });
}

function toggle(btn,item,res){
  if(recognition){ if(btn===currentBtn) recognition.stop(); return; }
  if(!SR){ showMessage(res,'此瀏覽器不支援語音辨識，請改用桌面版 Chrome 或 Edge。'); return; }
  startRecording(btn,item,res);
}

function startRecording(btn,item,res){
  finalTranscript=''; errorOccurred=false;
  currentBtn=btn;
  recognition=new SR();
  recognition.lang='zh-HK';
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;
  recognition.onstart=()=>{ btn.classList.add('recording'); btn.textContent='完成'; };
  recognition.onresult=e=>{
    let fin='', it='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) fin+=r[0].transcript; else it+=r[0].transcript;
    }
    if(fin) finalTranscript+=fin;
    res.style.display='block';
    res.innerHTML='<div class="listening">收聽中…</div>'+(finalTranscript||it?('<div class="said">'+escapeHtml(finalTranscript||it)+'</div>'):'');
  };
  recognition.onerror=e=>{ if(e.error!=='aborted') errorOccurred=true; };
  recognition.onend=()=>{
    recognition=null;
    clearTimeout(stopTimer);
    btn.classList.remove('recording');
    btn.textContent='背金句';
    if(errorOccurred){
      showMessage(res,'聽不到聲音或無法使用咪高峰，請檢查權限後再試。');
    }else if(finalTranscript.trim()){
      evaluate(item,res);
    }else{
      res.innerHTML=''; res.style.display='none';
    }
  };
  recognition.start();
  stopTimer=setTimeout(()=>{ if(recognition) recognition.stop(); },40000);
}

function evaluate(item,res){
  const said=finalTranscript.trim();
  const sc=scoreOf(said,item[2]);
  const cls=sc>=80?'good':(sc>=60?'mid':'low');
  res.style.display='block';
  res.innerHTML=
    '<div class="score-badge '+cls+'">評分：'+sc+' 分</div>'+
    '<div class="said">你背：'+escapeHtml(said)+'</div>'+
    '<div class="ans"><b>答案：</b>'+escapeHtml(item[2])+'</div>';
  clearTimeout(res._t);
  res._t=setTimeout(()=>{ res.innerHTML=''; res.style.display='none'; },10000);
}

function showMessage(res,msg){
  res.style.display='block';
  res.innerHTML='<div class="err">'+escapeHtml(msg)+'</div>';
  clearTimeout(res._t);
  res._t=setTimeout(()=>{ res.innerHTML=''; res.style.display='none'; },10000);
}

buildPanels();
bindTabs();
</script>
